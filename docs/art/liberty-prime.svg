    <path d="M548 240 L548 170 Q548 100 630 95 Q712 100 712 170 L712 240 Z" fill="url(#steel)"/>
    <path d="M552 150 Q630 128 708 150" fill="none" stroke="#2b3236" stroke-width="4"/>
    <rect x="560" y="160" width="140" height="26" rx="13" fill="#1a0d0a"/>
    <rect x="556" y="156" width="148" height="34" rx="17" fill="#ff6a2a" opacity="0.9" filter="url(#glowSmall)"/>
    <rect x="566" y="165" width="128" height="16" rx="8" fill="url(#visor)"/>
    <g stroke="#2b3236" stroke-width="4" stroke-linecap="round">
