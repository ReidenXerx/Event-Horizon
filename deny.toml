# ─────────────────────────────────────────────────────────────────────────
# The licence gate. Run in CI: `cargo deny check licenses`.
#
# WHY THIS EXISTS, AND WHY IT IS A GATE RATHER THAN A RULE IN A DOC:
# the Rust LOOT stack is genuinely the right library for load-order work and
# it is GPL-3-or-later. Verified on crates.io 2026-09-07: libloot 0.29.6 is
# GPL-3.0-or-later, esplugin 6.1.4 is GPL-3.0. Adding either to a crate in
# this workspace relicenses the whole product, permanently, and nothing in
# the build output would say so.
#
# `version = 2` means: anything not in `allow` FAILS. Adding to this list is
# a deliberate act, which is the point.
# ─────────────────────────────────────────────────────────────────────────
[graph]
# Check the dependency graph of the platforms we SHIP, not every target Rust
# knows. Without this, a wasm32-only dependency fails the gate: ureq's
# platform verifier pulls `webpki-root-certs` (CDLA-Permissive-2.0, the
# Mozilla CA bundle) on wasm32 alone. Every crate linked into a real build is
# still checked. Add a triple here before shipping to a new platform.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[licenses]
version = 2
confidence-threshold = 0.93
# Allow-list entries we have not hit yet are fine; a warning per unused entry
# would train everyone to ignore this tool's output.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Reached via zip's bzip2 backend. BSD-style, permissive, no copyleft.
    "bzip2-1.0.6",
    # Public-domain-equivalent dedications. Weaker obligations than MIT, not
    # stronger - safe to combine.
    "CC0-1.0",
    "MIT-0",
]

[bans]
deny = [
    # GPL-3. These belong in the separate sorter binary, never linked here.
    # Even if a licence were misdetected, the NAME never belongs in this tree.
    { name = "libloot" },
    { name = "esplugin" },
    { name = "libloadorder" },
    { name = "loot-condition-interpreter" },

    # THE LICENCE CHECK CANNOT SEE THIS ONE. Verified 2026-09-07: with
    # `--all-features`, `cargo deny check licenses` reports "licenses ok" and
    # lists unrar_sys@0.5.8 as MIT/Apache-2.0 - because that is its metadata.
    # The vendored `unrar_sys-0.5.8/vendor/unrar/license.txt` is the UnRAR
    # licence, which deny never opens. Banning by NAME is therefore the only
    # gate that actually fires. Enabling eh-archive's `rar` feature requires
    # deleting these two lines, which is the point: a licence decision should
    # cost a deliberate edit, not a flag nobody reads.
    { name = "unrar" },
    { name = "unrar_sys" },
]

[advisories]
version = 2
