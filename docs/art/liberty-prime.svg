  <!-- The laser, from the visor to the ruins -->
  <polygon points="706,160 1324,375 1276,485 694,186" fill="#ff6a2a" opacity="0.55" filter="url(#glow)"/>
  <polygon points="702,167 1309,410 1291,450 698,179" fill="#ff8a3d"/>
  <polygon points="701,171 1303,424 1297,436 699,175" fill="#fffbe8"/>
  <circle cx="1300" cy="430" r="160" fill="url(#blast)"/>
  <circle cx="1300" cy="430" r="42" fill="#fff8e0" filter="url(#glowSmall)"/>
  <g stroke="#ffd27a" stroke-width="4" stroke-linecap="round">
