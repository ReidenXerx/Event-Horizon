    <path d="M450 372 L392 332 L302 432 L352 482 Z" fill="url(#steel)"/>
    <path d="M356 462 L300 448 L232 300 L286 280 Z" fill="url(#steel)"/>
    <circle cx="328" cy="458" r="36" fill="url(#steel)" stroke="#2a3034" stroke-width="4"/>
    <circle cx="328" cy="458" r="13" fill="#2a3034"/>
    <g transform="translate(250 212) rotate(-25)">
      <path d="M-62 -18 L-98 -44 L-86 -8 Z" fill="#5d665d"/>
      <path d="M-62 18 L-98 44 L-86 8 Z" fill="#5d665d"/>
      <path d="M-70 0 Q-70 -32 -20 -34 L35 -30 Q70 -18 72 0 Q70 18 35 30 L-20 34 Q-70 32 -70 0 Z" fill="url(#nukeBody)"/>
      <path d="M35 -30 Q70 -18 72 0 Q70 18 35 30 Z" fill="#d9b640"/>
      <rect x="-8" y="-34" width="12" height="68" fill="#b3261e"/>
    </g>
    <circle cx="258" cy="290" r="44" fill="url(#steel)"/>
    <g stroke="#2a3034" stroke-width="4" stroke-linecap="round">
