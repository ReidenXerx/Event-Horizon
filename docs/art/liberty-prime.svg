      <circle cx="776" cy="290" r="4"/><circle cx="776" cy="334" r="4"/><circle cx="776" cy="378" r="4"/><circle cx="776" cy="422" r="4"/><circle cx="776" cy="490" r="4"/>
    </g>
    <circle cx="635" cy="495" r="26" fill="#1f3a78" stroke="#d9dde0" stroke-width="3"/>
    <path transform="translate(635 495)" d="M0,-17 L4.11,-5.66 L16.17,-5.25 L6.66,2.16 L9.99,13.75 L0,7 L-9.99,13.75 L-6.66,2.16 L-16.17,-5.25 L-4.11,-5.66 Z" fill="#f2efe6"/>
    <!-- right pauldron -->
