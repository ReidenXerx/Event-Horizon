      <line x1="596" y1="337" x2="674" y2="337"/>
      <line x1="596" y1="354" x2="674" y2="354"/>
      <line x1="596" y1="371" x2="674" y2="371"/>
      <line x1="596" y1="388" x2="674" y2="388"/>
      <line x1="596" y1="405" x2="674" y2="405"/>
      <line x1="596" y1="422" x2="674" y2="422"/>
