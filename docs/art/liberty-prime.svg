<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 768" width="1536" height="768">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140b24"/>
      <stop offset="0.45" stop-color="#4a1d3a"/>
      <stop offset="0.75" stop-color="#b8502f"/>
      <stop offset="1" stop-color="#f09a4a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.62" cy="0.8" r="0.5">
      <stop offset="0" stop-color="#ffd08a" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#ff8a3d" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1620"/>
      <stop offset="1" stop-color="#0c070c"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#394146"/>
      <stop offset="0.4" stop-color="#8e999e"/>
      <stop offset="0.75" stop-color="#666f74"/>
      <stop offset="1" stop-color="#d98a5c"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2528"/>
      <stop offset="0.5" stop-color="#4a5357"/>
      <stop offset="1" stop-color="#8a5a44"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a1f"/>
      <stop offset="0.6" stop-color="#fff2c8"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="nukeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d0c6"/>
      <stop offset="0.5" stop-color="#8f988e"/>
      <stop offset="1" stop-color="#4f574f"/>
    </linearGradient>
    <radialGradient id="blast" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8e0" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#ffc05a" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#ff5a1f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="glowSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="smoke" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="leftPauldron">
      <path d="M380 370 Q380 265 470 255 Q545 252 560 305 L560 390 Q470 410 380 385 Z"/>
    </clipPath>
  </defs>

  <!-- Sky, smoke and the far ruins of the Capital Wasteland -->
  <rect width="1536" height="768" fill="url(#sky)"/>
  <rect width="1536" height="768" fill="url(#sun)"/>
  <g fill="#2b1330" opacity="0.35">
    <ellipse cx="260" cy="170" rx="300" ry="40"/>
    <ellipse cx="1180" cy="120" rx="360" ry="45"/>
    <ellipse cx="900" cy="250" rx="260" ry="28"/>
  </g>
  <g fill="#5a2a36" opacity="0.85">
    <path d="M0 600 L0 540 L40 540 L40 500 L90 500 L90 530 L130 530 L130 470 L150 458 L175 470 L175 520 L230 520 L230 560 L330 560 L330 510 L360 510 L372 488 L390 510 L420 510 L420 575 L1000 575 L1000 560 Q1075 460 1150 560 L1180 560 L1180 520 L1200 505 L1215 520 L1215 575 L1536 575 L1536 600 Z"/>
    <path d="M1466 590 L1478 332 L1486 322 L1491 342 L1498 330 L1508 590 Z"/>
  </g>

  <!-- smoke rising from the hit, behind the blast -->
