    <line x1="1340" y1="440" x2="1450" y2="455"/>
    <line x1="1320" y1="465" x2="1395" y2="530"/>
    <line x1="1275" y1="462" x2="1240" y2="545"/>
    <line x1="1265" y1="410" x2="1195" y2="345"/>
    <line x1="1305" y1="395" x2="1330" y2="295"/>
    <line x1="1345" y1="425" x2="1470" y2="400"/>
