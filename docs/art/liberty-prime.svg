      <rect x="400" y="300" width="150" height="10" fill="#b3261e"/>
      <rect x="400" y="320" width="150" height="10" fill="#b3261e"/>
      <rect x="400" y="340" width="150" height="10" fill="#b3261e"/>
      <rect x="400" y="360" width="150" height="10" fill="#b3261e"/>
      <rect x="400" y="300" width="62" height="40" fill="#1f3a78"/>
      <g fill="#f2efe6">
        <circle cx="412" cy="310" r="2.5"/><circle cx="428" cy="310" r="2.5"/><circle cx="444" cy="310" r="2.5"/>
        <circle cx="420" cy="320" r="2.5"/><circle cx="436" cy="320" r="2.5"/><circle cx="452" cy="320" r="2.5"/>
        <circle cx="412" cy="330" r="2.5"/><circle cx="428" cy="330" r="2.5"/><circle cx="444" cy="330" r="2.5"/>
